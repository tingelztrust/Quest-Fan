<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Quest 3 面罩风扇接线示意</title>
<desc id="desc">电池 5V 与 GND 同时给 ESP32-C3 和 LR7843 供电，风扇正极接 5V，两个负极接 MOSFET LOAD，GPIO4 和 GND 分别接 PWM 与控制 GND。</desc>
<defs>
 <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#e5edf1" stroke-width="1"/></pattern>
 <style>
 text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#15283c}
 .head{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#52667b}
 .card{fill:#fff;stroke:#bacbd6;stroke-width:2}.name{font-size:24px;font-weight:700}.hint{font-size:16px;fill:#53697a}
 .pin{font-size:17px;font-weight:700}.pos{fill:#d83232}.neg{fill:#253449}.pwm{fill:#13896d}.load{fill:#ad6207}
 .wire{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
 </style>
</defs>
<rect width="1200" height="820" fill="#f5f9fb"/><rect width="1200" height="820" fill="url(#grid)"/>
<text x="50" y="52" class="head">Quest 3 面罩风扇 · 接线总览</text>
<text x="52" y="81" class="sub">示意图按电气连接绘制；实物端子位置、丝印和 XH2.54 正反面必须逐一核对，不能照照片里的线色盲插。</text>
<!-- Route the four electrically independent nets before overlaying components. No dot = no joint at crossing. -->
<g class="wire">
 <path d="M285 280H355V95H855V570H920 M355 180H425 M355 280V535H425 M855 275H920" stroke="#e04444"/>
 <path d="M285 385H390V235H425 M390 385V590H425 M695 235H740V590H695" stroke="#354357"/>
 <path d="M695 275H775V540H695" stroke="#159678"/>
 <path d="M695 655H810V320H920 M810 615H920" stroke="#dc881c"/>
</g>
<!-- Junction dots only where routes branch electrically. -->
<g fill="#e04444"><circle cx="355" cy="180" r="7"/><circle cx="355" cy="535" r="7"/><circle cx="855" cy="275" r="7"/><circle cx="855" cy="570" r="7"/></g>
<g fill="#354357"><circle cx="390" cy="235" r="7"/><circle cx="390" cy="590" r="7"/></g>
<g fill="#dc881c"><circle cx="810" cy="615" r="7"/></g>
<!-- Components -->
<rect class="card" x="42" y="194" rx="20" width="243" height="247"/>
<text x="64" y="242" class="name">5V 锂电池组</text>
<text x="64" y="271" class="hint">XH2.54 · 输出标称 2A</text>
<text x="64" y="314" class="hint">先确认输出实测为稳压 5V</text>
<text x="64" y="342" class="hint">与两只风扇共用电源</text>
<text x="162" y="287" class="pin pos">+5V</text><text x="162" y="393" class="pin neg">GND</text>
<rect class="card" x="425" y="120" rx="20" width="270" height="245"/>
<text x="450" y="160" class="name">ESP32-C3</text><text x="450" y="189" class="hint">SuperMini · 2.4 GHz Wi-Fi</text>
<text x="447" y="214" class="pin pos">5V  ◀</text><text x="447" y="265" class="pin neg">GND ◀</text>
<text x="547" y="305" class="pin pwm">GPIO4 PWM ▶</text><text x="551" y="255" class="pin neg">GND ▶</text>
<rect class="card" x="425" y="475" rx="20" width="270" height="235"/>
<text x="450" y="515" class="name">LR7843 MOSFET</text>
<text x="447" y="546" class="pin pos">电源 + ◀</text><text x="447" y="607" class="pin neg">电源 − ◀</text>
<text x="555" y="556" class="pin pwm">PWM ◀</text><text x="542" y="607" class="pin neg">PWM GND ◀</text>
<text x="542" y="673" class="pin load">LOAD ▶</text>
<rect class="card" x="920" y="208" rx="20" width="230" height="128"/>
<text x="941" y="248" class="name">4010 风扇 1</text><text x="940" y="283" class="pin pos">红 +5V ◀</text><text x="940" y="327" class="pin load">黑 − / LOAD ◀</text>
<rect class="card" x="920" y="503" rx="20" width="230" height="128"/>
<text x="941" y="543" class="name">4010 风扇 2</text><text x="940" y="578" class="pin pos">红 +5V ◀</text><text x="940" y="622" class="pin load">黑 − / LOAD ◀</text>
<rect x="42" y="748" width="1108" height="53" rx="13" fill="#e9f0f4"/>
<text x="63" y="780" font-size="17">线色图例：<tspan class="pos">■ +5V</tspan>　<tspan class="neg">■ 公共 GND</tspan>　<tspan class="pwm">■ GPIO4 → PWM</tspan>　<tspan class="load">■ 两风扇负极 → LOAD</tspan>　交叉无圆点＝不连接</text>
</svg>
